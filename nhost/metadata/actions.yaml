actions:
  - name: triggerWorkflowRun
    definition:
      handler: '{{FRONTEND_URL}}/api/actions/trigger'
      output_type: ActionResponse
      forward_client_headers: true
      type: mutation
      kind: synchronous
    permissions:
      - role: user
  - name: approveStep
    definition:
      handler: '{{FRONTEND_URL}}/api/actions/approve'
      output_type: ActionResponse
      forward_client_headers: true
      type: mutation
      kind: synchronous
    permissions:
      - role: user
custom_types:
  enums: []
  input_objects: []
  objects:
    - name: ActionResponse
  scalars: []
