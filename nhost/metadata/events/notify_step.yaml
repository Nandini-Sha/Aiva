event_triggers:
  - name: notify_step_trigger
    table:
      name: step_runs
      schema: public
    definition:
      insert:
        columns: '*'
      # Only fire when a notify step finishes
      payload:
        type: { _eq: "notify" }
        status: { _eq: "completed" }
    webhook:
      url: "{{NHOST_BACKEND_URL}}/api/notify"
    retry_conf:
      num_retries: 0
    headers: []
    request_transform:
      version: 2
      body: null
    # Enable manual firing for testing
    enable_manual: true
