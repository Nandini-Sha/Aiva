table:
  name: workflow_outputs
  schema: public
  columns:
    - name: id
      type: uuid
      default: "gen_random_uuid()"
    - name: workflow_run_id
      type: uuid
    - name: key
      type: text
    - name: value
      type: text
    - name: created_at
      type: timestamptz
      default: now()
  object_relationships:
    - name: workflow_run
      using:
        foreign_key_constraint_on: workflow_run_id
  select_permissions:
    - role: viewer
      permission:
        columns: '*'
        filter:
          workflow_run:
            workflow:
              organization:
                org_members:
                  user_id:
                    _eq: X-Hasura-User-Id
    - role: editor
      permission:
        columns: '*'
        filter:
          workflow_run:
            workflow:
              organization:
                org_members:
                  user_id:
                    _eq: X-Hasura-User-Id
    - role: owner
      permission:
        columns: '*'
        filter:
          workflow_run:
            workflow:
              organization:
                org_members:
                  user_id:
                    _eq: X-Hasura-User-Id
  insert_permissions:
    - role: editor
      permission:
        check:
          workflow_run:
            workflow:
              organization:
                org_members:
                  _and:
                    - user_id: { _eq: X-Hasura-User-Id }
                    - role: { _in: ["editor", "owner"] }
        columns: [workflow_run_id, key, value]
    - role: owner
      permission:
        check:
          workflow_run:
            workflow:
              organization:
                org_members:
                  _and:
                    - user_id: { _eq: X-Hasura-User-Id }
                    - role: { _eq: "owner" }
        columns: [workflow_run_id, key, value]
  update_permissions: []
  delete_permissions: []
