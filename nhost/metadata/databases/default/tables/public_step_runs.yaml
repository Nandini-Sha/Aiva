table:
  name: step_runs
  schema: public
object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: workflow_step
    using:
      foreign_key_constraint_on: step_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_run_id
        - step_id
        - status
        - input
        - output
        - error
        - attempt_count
        - approved_by
        - approved_at
        - started_at
        - completed_at
      filter:
        workflow_run:
          workflow:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      check:
        workflow_run:
          workflow:
            organization:
              org_members:
                role:
                  _in:
                    - editor
                    - owner
                user_id:
                  _eq: X-Hasura-User-Id
      columns:
        - workflow_run_id
        - step_id
        - status
        - input
update_permissions:
  - role: user
    permission:
      columns:
        - status
        - output
        - error
        - attempt_count
        - completed_at
        - approved_by
        - approved_at
      filter:
        workflow_run:
          workflow:
            organization:
              org_members:
                role:
                  _in:
                    - editor
                    - owner
                user_id:
                  _eq: X-Hasura-User-Id
      check: null
event_triggers:
  - name: notify_step_trigger
    definition:
      enable_manual: true
      insert:
        columns: '*'
      update:
        columns:
          - status
    retry_conf:
      interval_sec: 10
      num_retries: 0
      timeout_sec: 60
    webhook: '{{FRONTEND_URL}}/api/notify'
