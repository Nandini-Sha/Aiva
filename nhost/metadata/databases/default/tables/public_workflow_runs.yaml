table:
  name: workflow_runs
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: workflow_run_id
        table:
          name: step_runs
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - status
        - started_at
        - completed_at
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      check:
        workflow:
          organization:
            org_members:
              role:
                _in:
                  - editor
                  - owner
              user_id:
                _eq: X-Hasura-User-Id
      columns:
        - workflow_id
        - status
update_permissions:
  - role: user
    permission:
      columns:
        - status
        - completed_at
      filter:
        workflow:
          organization:
            org_members:
              role:
                _in:
                  - editor
                  - owner
              user_id:
                _eq: X-Hasura-User-Id
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        workflow:
          organization:
            org_members:
              role:
                _in:
                  - editor
                  - owner
              user_id:
                _eq: X-Hasura-User-Id
