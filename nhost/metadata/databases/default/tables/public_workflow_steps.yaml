table:
  name: workflow_steps
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
select_permissions:
  - role: viewer
    permission:
      columns: '*'
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
  - role: editor
    permission:
      columns: '*'
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
  - role: owner
    permission:
      columns: '*'
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
insert_permissions:
  - role: editor
    permission:
      check:
        _and:
          - workflow:
              organization:
                org_members:
                  _and:
                    - user_id: { _eq: X-Hasura-User-Id }
                    - role: { _in: ["editor", "owner"] }
          - type:
              _nin: ["db_write", "notify", "webhook"]
      columns: '*'
  - role: owner
    permission:
      check:
        workflow:
          organization:
            org_members:
              _and:
                - user_id: { _eq: X-Hasura-User-Id }
                - role: { _eq: "owner" }
      columns: '*'
update_permissions:
  - role: editor
    permission:
      check: null
      filter:
        _and:
          - workflow:
              organization:
                org_members:
                  _and:
                    - user_id: { _eq: X-Hasura-User-Id }
                    - role: { _in: ["editor", "owner"] }
          - type:
              _nin: ["db_write", "notify", "webhook"]
      columns:
        - config
        - order_index
  - role: owner
    permission:
      check: null
      filter:
        workflow:
          organization:
            org_members:
              _and:
                - user_id: { _eq: X-Hasura-User-Id }
                - role: { _eq: "owner" }
      columns:
        - config
        - order_index
delete_permissions:
  - role: editor
    permission:
      filter:
        _and:
          - workflow:
              organization:
                org_members:
                  _and:
                    - user_id: { _eq: X-Hasura-User-Id }
                    - role: { _in: ["editor", "owner"] }
          - type:
              _nin: ["db_write", "notify", "webhook"]
  - role: owner
    permission:
      filter:
        workflow:
          organization:
            org_members:
              _and:
                - user_id: { _eq: X-Hasura-User-Id }
                - role: { _eq: "owner" }
