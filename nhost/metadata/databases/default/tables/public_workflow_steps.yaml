table:
  name: workflow_steps
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
insert_permissions:
  - role: editor
    permission:
      check:
        _and:
          - workflow:
              organization:
                org_members:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _in:
                          - editor
                          - owner
          - type:
              _nin:
                - db_write
                - notify
                - webhook
      columns: '*'
  - role: owner
    permission:
      check:
        workflow:
          organization:
            org_members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner
      columns: '*'
select_permissions:
  - role: editor
    permission:
      columns: '*'
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
  - role: owner
    permission:
      columns: '*'
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns: '*'
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
update_permissions:
  - role: editor
    permission:
      columns:
        - config
        - order_index
      filter:
        _and:
          - workflow:
              organization:
                org_members:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _in:
                          - editor
                          - owner
          - type:
              _nin:
                - db_write
                - notify
                - webhook
      check: null
  - role: owner
    permission:
      columns:
        - config
        - order_index
      filter:
        workflow:
          organization:
            org_members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner
      check: null
delete_permissions:
  - role: editor
    permission:
      filter:
        _and:
          - workflow:
              organization:
                org_members:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _in:
                          - editor
                          - owner
          - type:
              _nin:
                - db_write
                - notify
                - webhook
  - role: owner
    permission:
      filter:
        workflow:
          organization:
            org_members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner
