table:
  name: workflow_steps
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - type
        - config
        - order_index
        - created_at
        - updated_at
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      check:
        workflow:
          organization:
            org_members:
              role:
                _in:
                  - editor
                  - owner
              user_id:
                _eq: X-Hasura-User-Id
      columns:
        - workflow_id
        - type
        - config
        - order_index
update_permissions:
  - role: user
    permission:
      columns:
        - type
        - config
        - order_index
      filter:
        workflow:
          organization:
            org_members:
              role:
                _in:
                  - editor
                  - owner
              user_id:
                _eq: X-Hasura-User-Id
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        workflow:
          organization:
            org_members:
              role:
                _in:
                  - editor
                  - owner
              user_id:
                _eq: X-Hasura-User-Id
